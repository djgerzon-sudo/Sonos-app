# Sonos The Party Rockers (ChatGPT) — compila APK debug en GitHub Actions.
# Cada push a main, o al pulsar "Run workflow", compila y publica el instalador.
name: Build APK (debug)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Compilar APK debug
        run: gradle assembleDebug --no-daemon

      - name: Preparar APK con nombre personalizado
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Sonos-The-Party-Rockers-ChatGPT.apk

      - name: Subir la APK
        uses: actions/upload-artifact@v4
        with:
          name: Sonos-The-Party-Rockers-ChatGPT
          path: app/build/outputs/apk/debug/Sonos-The-Party-Rockers-ChatGPT.apk
          if-no-files-found: error
          retention-days: 30
